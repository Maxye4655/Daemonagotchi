name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller daemonagotchi.spec --noconfirm

      - name: Rename binary per platform
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   cp dist/daemonagotchi     dist/daemonagotchi-linux-x64 ;;
            macOS)   cp dist/daemonagotchi     dist/daemonagotchi-macos-arm64 ;;
            Windows) cp dist/daemonagotchi.exe dist/daemonagotchi-windows-x64.exe ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: daemonagotchi-${{ runner.os }}
          path: dist/daemonagotchi-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
